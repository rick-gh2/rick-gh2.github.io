<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI修仙：無限人生</title>
<style>
:root {
  --bg-color: #0a0a12;
  --panel-bg: #14141f;
  --text-main: #e8e6e3;
  --text-muted: #7a7a8e;
  --accent: #d4af37;
  --accent-glow: #ffd700;
  --danger: #ff4c4c;
  --success: #4caf50;
  --info: #2196f3;
  --btn-bg: #1e1e2e;
  --btn-hover: #2a2a3e;
  --border-color: #2a2a3a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden;
}

/* ===== Landing Page ===== */
#landing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: linear-gradient(180deg, #0a0a12 0%, #1a1a2e 50%, #0a0a12 100%);
  position: relative;
}

#landing::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, rgba(212,175,55,0.08) 0%, transparent 70%);
  pointer-events: none;
}

#landing h1 {
  font-size: 3em;
  color: var(--accent-glow);
  text-shadow: 0 0 20px rgba(255,215,0,0.5), 0 0 60px rgba(212,175,55,0.3);
  margin-bottom: 10px;
  letter-spacing: 8px;
}

#landing .subtitle {
  color: var(--text-muted);
  font-size: 1.1em;
  margin-bottom: 40px;
}

#enter-btn {
  background: linear-gradient(135deg, #d4af37, #f0c060);
  color: #0a0a12;
  border: none;
  padding: 18px 60px;
  font-size: 1.3em;
  font-weight: bold;
  border-radius: 50px;
  cursor: pointer;
  animation: pulse-glow 2s ease-in-out infinite;
  transition: transform 0.2s;
}

#enter-btn:hover { transform: scale(1.05); }

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px rgba(212,175,55,0.4), 0 0 60px rgba(212,175,55,0.2); }
  50% { box-shadow: 0 0 30px rgba(212,175,55,0.7), 0 0 80px rgba(212,175,55,0.4); }
}

/* ===== Game Container ===== */
#game-container {
  display: none;
  gap: 20px;
  width: 100%;
  height: 100vh;
  padding: 15px;
}

#stats-panel {
  flex: 0.8;
  background-color: var(--panel-bg);
  padding: 15px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}

#stats-panel h3 {
  color: var(--accent);
  text-align: center;
  margin-bottom: 5px;
  font-size: 1.1em;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.85em;
  padding: 4px 0;
  border-bottom: 1px dashed #2a2a3a;
}

.stat-label { color: var(--text-muted); }
.stat-value { color: var(--accent); font-weight: bold; min-width: 50px; text-align: right; }
.stat-value.danger { color: var(--danger); }
.stat-value.success { color: var(--success); }

.stat-bar-container { margin-top: 8px; }
.stat-bar-label { display: flex; justify-content: space-between; font-size: 0.8em; margin-bottom: 3px; }
.stat-bar-bg { height: 8px; background: #1a1a2a; border-radius: 4px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

/* ===== Main Panel ===== */
#main-panel {
  flex: 2;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#log-panel {
  flex: 1;
  background-color: var(--panel-bg);
  padding: 15px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.log-entry {
  padding: 10px 14px;
  background-color: #1a1a28;
  border-left: 3px solid #555;
  border-radius: 4px;
  font-size: 0.9em;
  line-height: 1.6;
}

.log-entry.event { border-left-color: var(--accent); background: rgba(212,175,55,0.05); }
.log-entry.danger { border-left-color: var(--danger); }
.log-entry.system { border-left-color: var(--success); color: #4caf50; }
.log-entry.combat { border-left-color: #ff9800; background: rgba(255,152,0,0.05); }

/* ===== Action Panel ===== */
#action-panel {
  background-color: var(--panel-bg);
  padding: 15px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  min-height: 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

#choices-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
  justify-content: center;
}

button {
  background-color: var(--btn-bg);
  color: var(--text-main);
  border: 1px solid #444;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 0.95em;
  cursor: pointer;
  transition: all 0.2s;
}

button:hover:not(:disabled) {
  background-color: var(--btn-hover);
  border-color: var(--accent);
  color: var(--accent-glow);
  transform: translateY(-1px);
}

button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== Talent Selection ===== */
#talent-panel {
  background-color: var(--panel-bg);
  padding: 20px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
}

.talent-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  margin-top: 15px;
}

.talent-card {
  background: #1a1a28;
  border: 2px solid #333;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.talent-card:hover { border-color: var(--accent); background: rgba(212,175,55,0.08); }
.talent-card.selected { border-color: var(--accent-glow); box-shadow: 0 0 15px rgba(212,175,55,0.3); }

.talent-name { color: var(--accent-glow); font-weight: bold; margin-bottom: 4px; }
.talent-desc { color: var(--text-muted); font-size: 0.8em; line-height: 1.4; }
.talent-stats { color: #6a9f5e; font-size: 0.75em; margin-top: 6px; }

/* ===== Life Summary ===== */
#summary-panel {
  background-color: var(--panel-bg);
  padding: 20px;
  border-radius: 12px;
  border: 1px solid var(--accent);
}

.summary-title { color: var(--accent-glow); font-size: 1.3em; text-align: center; margin-bottom: 15px; }
.summary-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.summary-stat { background: #1a1a28; padding: 10px; border-radius: 8px; text-align: center; }
.summary-stat-label { color: var(--text-muted); font-size: 0.8em; }
.summary-stat-value { color: var(--accent-glow); font-weight: bold; font-size: 1.2em; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

/* ===== Responsive ===== */
@media (max-width: 700px) {
  #game-container { flex-direction: column; padding: 10px; gap: 8px; }
  #stats-panel { max-height: 40vh; }
  #landing h1 { font-size: 2em; letter-spacing: 4px; }
}

/* ===== Animations ===== */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.log-entry, .talent-card { animation: fadeIn 0.3s ease-in; }

.realm-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
.realm-fanren { background: #333; color: #aaa; }
.realm-lianqi { background: rgba(100,200,100,0.2); color: #6c6; }
.realm-zhuji { background: rgba(100,150,255,0.2); color: #6af; }
.realm-jindan { background: rgba(255,200,50,0.2); color: #fc3; }
.realm-yuanying { background: rgba(200,100,255,0.2); color: #c6f; }
.realm-huashen { background: rgba(255,100,100,0.2); color: #f66; }
.realm-dujie { background: rgba(255,255,255,0.2); color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
.realm-feisheng { background: linear-gradient(90deg, rgba(255,215,0,0.3), rgba(255,165,0,0.3)); color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.5); }
</style>
</head>
<body>

<!-- Landing Page -->
<div id="landing">
  <h1>AI修仙：無限人生</h1>
  <p class="subtitle">每一次輪迴，都是嶄新的仙途</p>
  <button id="enter-btn" onclick="startGame()">⚡ 進入遊戲 ⚡</button>
</div>

<!-- Game Container -->
<div id="game-container">
  <!-- Stats Panel -->
  <div id="stats-panel">
    <h3>🧘 人物狀態</h3>
    <div class="stat-row"><span class="stat-label">年齡</span><span id="s-age" class="stat-value">0</span></div>
    <div class="stat-row"><span class="stat-label">壽元</span><span id="s-lifespan" class="stat-value">80</span></div>
    <div class="stat-row"><span class="stat-label">境界</span><span id="s-realm" class="realm-badge realm-fanren">凡人</span></div>
    <div class="stat-row"><span class="stat-label">靈根</span><span id="s-root" class="stat-value">-</span></div>
    <hr style="border-color:#2a2a3a; margin:4px 0;">
    
    <div class="stat-bar-container">
      <div class="stat-bar-label"><span class="stat-label">生命</span><span id="s-hp-text" class="stat-value">100/100</span></div>
      <div class="stat-bar-bg"><div id="bar-hp" class="stat-bar-fill" style="width:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);"></div></div>
    </div>
    
    <div class="stat-row"><span class="stat-label">修為</span><span id="s-power" class="stat-value">0</span></div>
    <div class="stat-bar-container">
      <div class="stat-bar-label"><span class="stat-label">突破進度</span><span id="s-realm-text" class="stat-value">0%</span></div>
      <div class="stat-bar-bg"><div id="bar-power" class="stat-bar-fill" style="width:0%;background:linear-gradient(90deg,#2196f3,#4fc3f7);"></div></div>
    </div>

    <hr style="border-color:#2a2a3a; margin:4px 0;">
    
    <div class="stat-row"><span class="stat-label">氣運</span><span id="s-luck" class="stat-value">50</span></div>
    <div class="stat-row"><span class="stat-label">悟性</span><span id="s-intel" class="stat-value">50</span></div>
    <div class="stat-row"><span class="stat-label">魅力</span><span id="s-charm" class="stat-value">50</span></div>
    <div class="stat-row"><span class="stat-label">根骨</span><span id="s-strength" class="stat-value">50</span></div>
    <div class="stat-row"><span class="stat-label">功德</span><span id="s-merit" class="stat-value">0</span></div>
  </div>

  <!-- Main Panel -->
  <div id="main-panel">
    <div id="log-panel"></div>
    
    <!-- Talent Selection (shown at start) -->
    <div id="talent-panel" style="display:none;">
      <h3 style="color:var(--accent);text-align:center;margin-bottom:5px;">🌟 選擇天賦（選1個）</h3>
      <p style="text-align:center;color:var(--text-muted);font-size:0.85em;">每個天賦賦予你獨特的修仙之路</p>
      <div class="talent-grid" id="talent-grid"></div>
    </div>

    <!-- Action Panel -->
    <div id="action-panel">
      <button id="btn-start" style="display:none;" onclick="confirmTalent()">確認天賦，開始人生</button>
      <button id="btn-next" style="display:none;" onclick="advanceYear()">⏩ 推進下一年</button>
      <div id="choices-container"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// GAME DATA
// ============================================================

const REALMS = [

  { name: "築基期", reqPower: 800,   lifespan: 300, cls: "realm-zhuji" },
  { name: "金丹期", reqPower: 2500,  lifespan: 600, cls: "realm-jindan" },

const TALENTS = [
  { id: "sword_genius",   name: "劍道天賦",    desc: "天生與劍有緣，修煉速度極快",     effect: { powerMult: 1.5, strength: 30, intel: -10 } },
  { id: "fortune_blessed",name: "氣運加身",    desc: "天生好運，機遇無盡",            effect: { luck: 60, charm: 20, powerMult: 0.9 } },
  { id: "ancient_knowledge",name: "上古傳承",   desc: "體內封印著上古大能的記憶",       effect: { intel: 50, power: 100, strength: -10 } },

  { id: "buddhist_karma", name: "佛門善根",    desc: "前世是得道高僧，功德深厚",       effect: { merit: 50, luck: 30, hpBonus: 20 } },
  { id: "heavenly_forge", name: "天工開物",    desc: "煉器成癡，萬物皆可煉",          effect: { intel: 40, strength: 20, power: 50 } },

// Event database - structured with conditions and choices

  // === Childhood Events (age < 10) ===

  { id:"daily_3", title:"妖獸襲村", minAge:16, maxAge:999, weight:4,
    condition:(p)=>Math.random() < 0.25,
    text:"一隻低階妖獸闖入村落！",
    choices:[
      { text:"出手降妖", effect:{power:30,luck:-5}, log:"你一掌擊殺妖獸，但身上也受了些傷。" },
      { text:"讓村民躲避", effect:{merit:10,charm:10}, log:"你保護了村民，大家感激不盡。" }
    ]
  },
];

// ============================================================
// GAME STATE
// ============================================================
let player = {
  age: 0, hp: 100, power: 0, luck: 50, intel: 50, charm: 50, strength: 50, merit: 0,
  root: "", realmIndex: 0, isDead: false, talentId: null, metMaster: false,
  eventsTriggered: [], lifeSummary: []
};

// ============================================================
// UI HELPERS
// ============================================================
const $ = id => document.getElementById(id);
const ui = {
  age:$('s-age'), lifespan:$('s-lifespan'), realm:$('s-realm'), root:$('s-root'),
  hpText:$('s-hp-text'), power:$('s-power'), luck:$('s-luck'), intel:$('s-intel'),
  charm:$('s-charm'), strength:$('s-strength'), merit:$('s-merit'),
  barHp:$('bar-hp'), barPower:$('bar-power'), realmText:$('s-realm-text'),
  logPanel:$('log-panel'), btnNext:$('btn-next'), choicesContainer:$('choices-container'),
  talentPanel:$('talent-panel'), talentGrid:$('talent-grid'), btnStart:$('btn-start')
};

function updateStatsUI() {
  ui.age.innerText = player.age;
  const r = REALMS[player.realmIndex];
  ui.lifespan.innerText = r.lifespan === 9999 ? '∞' : r.lifespan;
  ui.realm.className = `realm-badge ${r.cls}`;
  ui.realm.innerText = r.name;
  ui.root.innerText = player.root || '-';
  ui.hpText.innerText = `${Math.max(0,player.hp)}/100`;
  ui.power.innerText = player.power;
  ui.luck.innerText = player.luck;
  ui.intel.innerText = player.intel;
  ui.charm.innerText = player.charm;
  ui.strength.innerText = player.strength;
  ui.merit.innerText = player.merit;

  // HP bar
  const hpPct = Math.max(0, player.hp);
  ui.barHp.style.width = hpPct + '%';
  ui.barHp.style.background = hpPct > 60 ? 'linear-gradient(90deg,#4caf50,#8bc34a)' : hpPct > 30 ? '#ff9800' : 'linear-gradient(90deg,#f44336,#ff5722)';

  // Power bar
  const next = REALMS[player.realmIndex + 1];
  if (next) {
    const prevReq = REALMS[player.realmIndex].reqPower;
    const pct = Math.min(100, ((player.power - prevReq) / (next.reqPower - prevReq)) * 100);
    ui.barPower.style.width = pct + '%';
    ui.realmText.innerText = `突破需 ${next.reqPower}（${pct.toFixed(0)}%）`;
  } else {
    ui.barPower.style.width = '100%';
    ui.realmText.innerText = '已達極致';
  }
}

function appendLog(text, type="normal") {
  const el = document.createElement('div');
  el.className = `log-entry ${type}`;
  el.innerHTML = `<strong>【${player.age}歲 · ${REALMS[player.realmIndex].name}】</strong><br>${text}`;
  ui.logPanel.appendChild(el);
  ui.logPanel.scrollTop = ui.logPanel.scrollHeight;
}

// ============================================================
// GAME FLOW
// ============================================================
function startGame() {
  $('landing').style.display = 'none';
  $('game-container').style.display = 'flex';
  
  // Randomize root
  const rootRoll = Math.random();
  if (rootRoll < 0.05) player.root = ROOTS[0].name;        // 天靈根 5%
  else if (rootRoll < 0.15) player.root = ROOTS[1].name;   // 變異靈根 10%
  else if (rootRoll < 0.45) player.root = ROOTS[2].name;   // 真靈根 30%
  else if (rootRoll < 0.80) player.root = ROOTS[3].name;   // 偽靈根 35%
  else player.root = ROOTS[4].name;                         // 無靈根 20%

  const rootData = ROOTS.find(r => r.name === player.root);
  player.luck += rootData.luckBonus;
  
  ui.logPanel.innerHTML = '';
  appendLog(`你出生了。天賦：<strong>${player.root}</strong>`, "system");
  
  updateStatsUI();

  // Show talent selection
  renderTalents();
  ui.talentPanel.style.display = 'block';
  ui.btnStart.style.display = 'block';
}

function renderTalents() {
  ui.talentGrid.innerHTML = '';
  TALENTS.forEach(t => {
    const card = document.createElement('div');
    card.className = 'talent-card';
    let statsHtml = '';
    if (t.effect.power) statsHtml += `修為+${t.effect.power} `;
    if (t.effect.luck) statsHtml += `氣運+${t.effect.luck} `;
    if (t.effect.intel) statsHtml += `悟性+${t.effect.intel} `;
    if (t.effect.charm) statsHtml += `魅力+${t.effect.charm} `;
    if (t.effect.strength) statsHtml += `根骨+${t.effect.strength} `;
    if (t.effect.hpBonus) statsHtml += `HP+${t.effect.hpBonus} `;
    if (t.effect.merit) statsHtml += `功德+${t.effect.merit} `;

    card.innerHTML = `<div class="talent-name">${t.name}</div><div class="talent-desc">${t.desc}</div><div class="talent-stats">${statsHtml.trim()}</div>`;
    card.onclick = () => selectTalent(t, card);
    ui.talentGrid.appendChild(card);
  });
}

function selectTalent(talent, el) {
  player.talentId = talent.id;
  document.querySelectorAll('.talent-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function confirmTalent() {
  if (!player.talentId) { alert('請選擇一個天賦！'); return; }
  
  const talent = TALENTS.find(t => t.id === player.talentId);
  // Apply talent effects
  for (let key in talent.effect) {
    if (key === 'powerMult') player._powerMult = talent.effect[key];
    else if (key === 'hpBonus') player.hp += talent.effect.hpBonus;
    else if (player.hasOwnProperty(key)) player[key] += talent.effect[key];
  }

  ui.talentPanel.style.display = 'none';
  ui.btnStart.style.display = 'none';
  ui.btnNext.style.display = 'block';

  appendLog(`天賦覺醒：<strong>${talent.name}</strong> — ${talent.desc}`, "system");
}

function advanceYear() {
  if (player.isDead) return;

  player.age++;
  const maxAge = REALMS[player.realmIndex].lifespan;

  // Lifespan check
  if (player.age > maxAge && player.realmIndex < REALMS.length - 1) {
    player.isDead = true;
    player.hp = 0;
    appendLog("大限已至，壽元耗盡。你坐化於天地之間。", "danger");
    updateStatsUI();
    showSummary();
    return;
  }

  // Recovery
  if (player.hp > 0 && player.hp < 100) player.hp += 5;
  if (player.hp > 100) player.hp = 100;

  triggerEvent();
}

function triggerEvent() {
  const validEvents = EVENTS.filter(e =>
    e.minAge <= player.age &&
    (!e.maxAge || player.age <= e.maxAge) &&
    (!e.realmMin || player.realmIndex >= e.realmMin) &&
    (!e.condition || e.condition(player)) &&
    !player.eventsTriggered.includes(e.id)
  );

  if (validEvents.length === 0) {
    appendLog("平靜的一年，無事發生。", "normal");
    updateStatsUI();
    return;
  }

  // Weighted random selection
  const totalWeight = validEvents.reduce((s, e) => s + (e.weight || 1), 0);
  let roll = Math.random() * totalWeight;
  for (const ev of validEvents) {
    roll -= (ev.weight || 1);
    if (roll <= 0) { player.eventsTriggered.push(ev.id); triggerEventLogic(ev); return; }
  }

  const last = validEvents[validEvents.length - 1];
  player.eventsTriggered.push(last.id);
  triggerEventLogic(last);
}

function triggerEventLogic(event) {
  appendLog(`<strong>📖 ${event.title}</strong><br>${event.text}`, "event");

  if (event.choices && event.choices.length > 0) {
    ui.btnNext.style.display = 'none';
    ui.choicesContainer.innerHTML = '';
    
    event.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.innerText = `▸ ${choice.text}`;
      btn.onclick = () => handleChoice(event, choice);
      ui.choicesContainer.appendChild(btn);
    });
  } else {
    updateStatsUI();
  }
}

function handleChoice(event, choice) {
  // Apply effects
  if (choice.effect.power && player._powerMult) {
    player.power += Math.floor(choice.effect.power * player._powerMult);
  } else if (choice.effect.power) {
    player.power += choice.effect.power;
  }

  for (let key in choice.effect) {
    if (key === 'power') continue;
    if (player.hasOwnProperty(key)) player[key] += choice.effect[key];
  }

  // Mark event as triggered
  if (choice.metMaster !== undefined) player.metMaster = choice.metMaster;

  appendLog(choice.log, "normal");

  // Death check
  if (player.hp <= 0) {
    player.isDead = true;
    player.hp = 0;
    appendLog("你受傷過重，身死道消。", "danger");
    updateStatsUI();
    showSummary();
    return;
  }

  // Realm upgrade check
  const nextRealm = REALMS[player.realmIndex + 1];
  if (nextRealm && player.power >= nextRealm.reqPower) {
    player.realmIndex++;
    player.hp = Math.min(100, player.hp + 50);
    appendLog(`🌟 <strong>【境界突破】</strong>天降祥瑞！你成功突破至<strong>${nextRealm.name}</strong>，壽元大增！`, "system");
    
    if (player.realmIndex === REALMS.length - 1) {
      appendLog("🔥 <strong>恭喜你飛升仙界！你已超越凡人極限，踏入仙道終極境界！</strong>", "system");
      player.isDead = true;
      updateStatsUI();
      setTimeout(showSummary, 2000);
      return;
    }
  }

  updateStatsUI();
  ui.choicesContainer.innerHTML = '';
  ui.btnNext.style.display = 'block';
}

function showSummary() {
  const nextRealm = REALMS[player.realmIndex + 1];
  const totalPower = player.power;
  
  let deathCause = "壽元耗盡";
  if (player.hp <= 0) deathCause = "戰鬥身亡";
  else if (player.isDead && player.realmIndex === REALMS.length - 1) deathCause = "飛升仙界";

  const summaryHtml = `
    <div class="summary-title">📜 人生紀錄</div>
    <div style="text-align:center;color:var(--text-muted);margin-bottom:15px;">${deathCause}</div>
    <div class="summary-stats">
      <div class="summary-stat"><div class="summary-stat-label">最終境界</div><div class="summary-stat-value">${REALMS[player.realmIndex].name}</div></div>
      <div class="summary-stat"><div class="summary-stat-label">享年</div><div class="summary-stat-value">${player.age}歲</div></div>
      <div class="summary-stat"><div class="summary-stat-label">靈根</div><div class="summary-stat-value">${player.root}</div></div>
      <div class="summary-stat"><div class="summary-stat-label">修為總計</div><div class="summary-stat-value">${totalPower.toLocaleString()}</div></div>
      <div class="summary-stat"><div class="summary-stat-label">氣運</div><div class="summary-stat-value">${player.luck}</div></div>
      <div class="summary-stat"><div class="summary-stat-label">悟性</div><div class="summary-stat-value">${player.intel}</div></div>
    </div>
    <div style="text-align:center;margin-top:20px;">
      <button onclick="location.reload()" style="background:linear-gradient(135deg,#d4af37,#f0c060);color:#0a0a12;border:none;padding:12px 30px;font-size:1em;font-weight:bold;border-radius:50px;">🔄 再入輪迴</button>
    </div>
  `;

  ui.logPanel.innerHTML = '';
  appendLog(summaryHtml, "system");
  ui.btnNext.style.display = 'none';
  ui.choicesContainer.innerHTML = '';
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !player.isDead) {
    const btn = $('btn-next');
    if (btn.style.display !== 'none') advanceYear();
  }
});
</script>
</body>
</html>
