<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際逃亡者 - Starfall Escape</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        /* HUD */
        #hud { position: fixed; top: 0; left: 0; right: 0; padding: 15px 25px 8px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
        .hud-item { background: rgba(0,0,0,0.6); border: 1px solid rgba(0,255,255,0.3); border-radius: 8px; padding: 8px 16px; backdrop-filter: blur(4px); }
        .hud-label { font-size: 10px; color: #0ff; text-transform: uppercase; letter-spacing: 2px; }
        .hud-value { font-size: 22px; font-weight: bold; text-shadow: 0 0 10px currentColor; }
        #score-display { color: #ff0; } #wave-display { color: #f0f; }
        #health-bar-container { width: 200px; height: 8px; background: rgba(255,0,0,0.2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        #health-bar { height: 100%; background: linear-gradient(90deg, #f00, #ff0, #0f0); transition: width 0.3s; border-radius: 4px; }

        /* Music toggle - top right */
        #music-toggle { position: fixed; top: 12px; right: 16px; z-index: 30; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 14px; cursor: pointer; border-radius: 20px; font-size: 14px; backdrop-filter: blur(4px); }

        /* Screens */
        .overlay-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #start-screen { background: radial-gradient(ellipse at center, #1a0033 0%, #0a0a0f 70%); }
        #gameover-screen { background: rgba(0,0,0,0.85); display: none; }

        h1.title { font-size: clamp(28px, 6vw, 52px); background: linear-gradient(90deg, #0ff, #f0f, #ff0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; animation: glow-pulse 2s ease-in-out infinite; }
        @keyframes glow-pulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3)} }
        .subtitle { font-size: clamp(12px, 3vw, 16px); color: #888; margin-bottom: 40px; text-align: center; padding: 0 20px; }

        /* Difficulty buttons */
        .diff-group { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }
        .diff-btn { padding: 12px 24px; font-size: clamp(13px, 3vw, 16px); background: transparent; border: 2px solid #555; color: #aaa; cursor: pointer; border-radius: 25px; transition: all 0.3s; font-family: inherit; }
        .diff-btn.selected { border-color: #0ff; color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.3); background: rgba(0,255,255,0.1); }
        .diff-btn:hover { border-color: #0ff; color: #fff; }

        .btn-start { padding: 15px 50px; font-size: clamp(16px, 4vw, 20px); background: transparent; border: 2px solid #0ff; color: #0ff; cursor: pointer; border-radius: 30px; transition: all 0.3s; font-family: inherit; text-transform: uppercase; letter-spacing: 3px; }
        .btn-start:hover { background: #0ff; color: #000; box-shadow: 0 0 30px rgba(0,255,255,0.5); }

        /* Game Over */
        .gameover-title { font-size: clamp(28px, 7vw, 48px); color: #f00; text-shadow: 0 0 20px rgba(255,0,0,0.5); margin-bottom: 10px; }
        .final-score { font-size: clamp(16px, 4vw, 28px); color: #ff0; margin-bottom: 30px; text-align: center; padding: 0 20px; }

        /* Notifications */
        #powerup-notify { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: clamp(18px, 4vw, 28px); color: #0f0; text-shadow: 0 0 20px currentColor; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 50; }
        #boss-warning { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: clamp(20px, 5vw, 36px); color: #f00; text-shadow: 0 0 30px rgba(255,0,0,0.8); pointer-events: none; opacity: 0; z-index: 50; animation: boss-flash 0.5s ease-in-out infinite alternate; }
        @keyframes boss-flash { from{opacity:0.3} to{opacity:1} }
        #combo-display { position: fixed; top: clamp(48px, 7vh, 70px); right: 25px; font-size: clamp(14px, 3vw, 18px); color: #ff0; text-shadow: 0 0 10px currentColor; opacity: 0; transition: opacity 0.3s; }
        #boss-hp-display { position: fixed; bottom: clamp(70px, 12vh, 25px); left: 50%; transform: translateX(-50%); font-size: clamp(10px, 2vw, 13px); color: #f44; text-shadow: 0 0 8px rgba(255,0,0,0.6); pointer-events: none; opacity: 0; z-index: 10; transition: opacity 0.3s; }

        /* Instructions */
        .instructions { margin-top: 25px; font-size: clamp(11px, 2.8vw, 13px); color: #666; text-align: center; line-height: 2; padding: 0 20px; }
        .instructions kbd { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); padding: 2px 8px; border-radius: 4px; }

        /* Navigation */
        .nav-link { position: fixed; bottom: clamp(70px, 10vh, 20px); left: 20px; z-index: 20; color: #666; text-decoration: none; font-size: 13px; }

        /* Mobile Controls */
        #mobile-controls { display: none; position: fixed; bottom: 10px; left: 0; right: 0; z-index: 15; padding: 0 12px; }
        .mobile-btn-row { display: flex; justify-content: space-between; align-items: center; height: clamp(60px, 10vh, 80px); }
        .mobile-btn { width: clamp(50px, 13vw, 65px); height: clamp(50px, 13vw, 65px); border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); color: #fff; font-size: clamp(18px, 4vw, 24px); display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; transition: background 0.1s; }
        .mobile-btn:active { background: rgba(0,255,255,0.2); border-color: #0ff; }
        .mobile-btn-fire { width: clamp(60px, 15vw, 80px); height: clamp(60px, 15vw, 80px); border-color: rgba(255,100,100,0.4); font-size: clamp(22px, 5vw, 30px); }
        .mobile-btn-fire:active { background: rgba(255,80,80,0.25); border-color: #f66; }

        @media (max-width: 768px), (pointer: coarse) {
            #mobile-controls { display: block !important; }
        }
    </style>
</head>
<body>

<div id="hud">
    <div class="hud-item"><div class="hud-label">Score</div><div class="hud-value" id="score-display">0</div></div>
    <div class="hud-item"><div class="hud-label">Wave</div><div class="hud-value" id="wave-display">1</div></div>
    <div class="hud-item"><div class="hud-label">HP</div><div id="health-bar-container"><div id="health-bar" style="width:100%"></div></div></div>
</div>

<div id="combo-display"></div>
<div id="powerup-notify"></div>
<div id="boss-warning">&#9888; BOSS APPROACHING &#9888;</div>
<div id="boss-hp-display"></div>

<button id="music-toggle" onclick="toggleMusic()">&#128265; BGM</button>

<!-- Start Screen -->
<div id="start-screen" class="overlay-screen">
    <h1 class="title">星際逃亡者</h1>
    <p class="subtitle">STARFALL ESCAPE — v3.0 Day 2</p>
    <div class="diff-group">
        <button class="diff-btn selected" data-diff="easy" onclick="selectDiff(this)">😊 簡單</button>
        <button class="diff-btn" data-diff="normal" onclick="selectDiff(this)">😐 普通</button>
        <button class="diff-btn" data-diff="hard" onclick="selectDiff(this)">🔥 困難</button>
    </div>
    <button class="btn-start" onclick="startGame()">開始遊戲</button>
    <div class="instructions">
        <kbd>A</kbd><kbd>D</kbd> / <kbd>&larr;</kbd><kbd>&rarr;</kbd> 移動<br>
        <kbd>Space</kbd> 射擊 &nbsp;|&nbsp; <kbd>P</kbd> 暫停<br>
        收集能量球升級武器 &#9889; 躲避流星 ☄️<br>
        <span style="color:#f44">⚠ 3 種 Boss 登場！每 3 wave 出現 Boss</span>
    </div>
</div>

<!-- Game Over Screen -->
<div id="gameover-screen" class="overlay-screen">
    <h2 class="gameover-title">GAME OVER</h2>
    <div class="final-score" id="final-score"></div>
    <button class="btn-start" onclick="restartGame()">重新開始</button>
</div>

<!-- Mobile Controls -->
<div id="mobile-controls">
    <div class="mobile-btn-row">
        <div class="mobile-btn" id="btn-left">&#9664;</div>
        <div class="mobile-btn mobile-btn-fire" id="btn-fire">&#128293;</div>
        <div class="mobile-btn" id="btn-right">&#9654;</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// ============================================================
//  STARFALL ESCAPE v3.0 Day 2 — New Enemies + Bosses
//  - 4 new enemy types: Sinker(蛇行), Tank(高HP慢速), Healer(治療者), Sniper(狙擊手)
//  - 3 boss variants: Starship(範圍砲擊), ShadowQueen(分身+隱形), Devastator(三階段變身)
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Game State ---
let gameState = 'menu';
let score = 0, wave = 1, combo = 0, comboTimer = 0, lastTime = 0, animFrame = null;

const player = { x:0, y:0, w:40, h:50, speed:6, hp:100, maxHp:100, weaponLevel:1, shootCooldown:0, invincible:0, trail:[] };

// Difficulty settings (Day 2 tuned)
let difficulty = 'easy';
const diffSettings = {
    easy:   { enemySpeedMul: 0.75, enemyHPMul: 0.65, spawnRate: 0.55, meteorFreq: 0.35, playerHp: 150, waveHeal: 35 },
    normal: { enemySpeedMul: 1.0,  enemyHPMul: 1.0,  spawnRate: 1.0,  meteorFreq: 1.0,  playerHp: 100, waveHeal: 20 },
    hard:   { enemySpeedMul: 1.5,  enemyHPMul: 1.6,  spawnRate: 1.7,  meteorFreq: 2.0,  playerHp: 65,  waveHeal: 8 }
};

let bullets=[], enemies=[], particles=[], powerups=[], meteors=[], stars=[];
const screenShake = { x:0, y:0, intensity:0 };

// --- Input ---
const keys = {};
let mobileLeft=false, mobileRight=false, mobileFireing=false;

window.addEventListener('keydown', e => { keys[e.code]=true; if(e.code==='KeyP') togglePause(); });
window.addEventListener('keyup', e => { keys[e.code]=false; });

(function(){
    const btnL = document.getElementById('btn-left');
    const btnR = document.getElementById('btn-right');
    const btnF = document.getElementById('btn-fire');
    function addTouch(el, onStart, onEnd){
        el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); onStart(); }, {passive:false});
        el.addEventListener('touchend',   e => { e.preventDefault(); e.stopPropagation(); onEnd(); },  {passive:false});
        el.addEventListener('touchcancel',e => { e.preventDefault(); onEnd(); }, {passive:false});
    }
    addTouch(btnL, () => mobileLeft=true,     () => mobileLeft=false);
    addTouch(btnR, () => mobileRight=true,    () => mobileRight=false);
    addTouch(btnF, () => mobileFireing=true,   () => mobileFireing=false);
    btnL.addEventListener('mousedown', e=>{e.preventDefault();mobileLeft=true;});
    btnL.addEventListener('mouseup',  e=>{e.preventDefault();mobileLeft=false;});
    btnR.addEventListener('mousedown', e=>{e.preventDefault();mobileRight=true;});
    btnR.addEventListener('mouseup',  e=>{e.preventDefault();mobileRight=false;});
    btnF.addEventListener('mousedown', e=>{e.preventDefault();mobileFireing=true;});
    btnF.addEventListener('mouseup',  e=>{e.preventDefault();mobileFireing=false;});
})();

function selectDiff(btn){
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    difficulty = btn.dataset.diff;
}

// --- Audio Engine ---
let audioCtx=null, musicPlaying=false, bgmNodes=[];
let bossWarningTimeout=null;

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}

function toggleMusic(){
    initAudio();musicPlaying=!musicPlaying;
    document.getElementById('music-toggle').textContent=musicPlaying?'&#128266; BGM':'&#128265; BGM';
    if(musicPlaying)startBGM();else stopBGM();
}

function startBGM(){
    if(!audioCtx||!musicPlaying)return;
    const bassOsc=audioCtx.createOscillator(),bassGain=audioCtx.createGain();
    bassOsc.type='sawtooth';bassOsc.frequency.setValueAtTime(55,audioCtx.currentTime);
    bassGain.gain.setValueAtTime(0.12,audioCtx.currentTime);
    const padOsc=audioCtx.createOscillator(),padGain=audioCtx.createGain();
    padOsc.type='sine';padOsc.frequency.setValueAtTime(220,audioCtx.currentTime);
    padGain.gain.setValueAtTime(0.06,audioCtx.currentTime);
    bassOsc.connect(bassGain).connect(audioCtx.destination);
    padOsc.connect(padGain).connect(audioCtx.destination);
    bassOsc.start();padOsc.start();bgmNodes.push(bassOsc,padOsc);
    scheduleNotes();
}
function stopBGM(){bgmNodes.forEach(n=>{try{n.stop();}catch(e){}});bgmNodes=[];}

function scheduleNotes(){
    if(!musicPlaying)return;const now=audioCtx.currentTime;
    const notes=[261.6,293.7,329.6,349.2,392,440,493.9];
    for(let i=0;i<8;i++){
        const freq=notes[Math.floor(Math.random()*notes.length)];
        const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
        osc.type='triangle';osc.frequency.setValueAtTime(freq,now+i*0.5);
        gain.gain.setValueAtTime(0,now+i*0.5);
        gain.gain.linearRampToValueAtTime(0.08,now+i*0.5+0.05);
        gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.5+0.45);
        osc.connect(gain).connect(audioCtx.destination);osc.start(now+i*0.5);osc.stop(now+i*0.5+0.5);
    }
    for(let i=0;i<4;i++){
        const b=audioCtx.createOscillator(),g=audioCtx.createGain();
        b.type='sine';b.frequency.setValueAtTime(55,now+i);
        g.gain.setValueAtTime(0.15,now+i);g.gain.exponentialRampToValueAtTime(0.001,now+i+0.9);
        b.connect(g).connect(audioCtx.destination);b.start(now+i);b.stop(now+i+1);
    }
    setTimeout(scheduleNotes,4000);
}

// --- Sound Effects ---
function playSFX(type){
    if(!audioCtx)return;const now=audioCtx.currentTime;
    switch(type){
        case 'shoot':{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(800,now);o.frequency.exponentialRampToValueAtTime(200,now+0.1);g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+0.15);break;}
        case 'explosion':{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,now);o.frequency.exponentialRampToValueAtTime(30,now+0.4);g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+0.5);break;}
        case 'powerup':{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(400,now);o.frequency.linearRampToValueAtTime(800,now+0.2);g.gain.setValueAtTime(0.1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+0.4);break;}
        case 'hit':{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(150,now);g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+0.2);break;}
        case 'enemyShoot':{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(300,now);o.frequency.exponentialRampToValueAtTime(100,now+0.15);g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.2);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+0.25);break;}
        case 'meteor':{const bufLen=audioCtx.sampleRate*0.3,buf=audioCtx.createBuffer(1,bufLen,audioCtx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<bufLen;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(bufLen*0.3));const src=audioCtx.createBufferSource(),filt=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;filt.type='lowpass';filt.frequency.value=800;g.gain.setValueAtTime(0.1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);src.connect(filt).connect(g).connect(audioCtx.destination);src.start();break;}
        case 'boss':{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(80,now);o.frequency.linearRampToValueAtTime(40,now+1.5);g.gain.setValueAtTime(0.2,now);g.gain.exponentialRampToValueAtTime(0.001,now+2);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+2.5);break;}
        case 'heal':{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(600,now);o.frequency.linearRampToValueAtTime(900,now+0.3);g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+0.5);break;}
    }
}

// --- Stars ---
function initStars(){stars=[];for(let i=0;i<200;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+0.5,speed:Math.random()*1.5+0.3,brightness:Math.random()});}}
function updateStars(dt){stars.forEach(s=>{s.y+=s.speed;if(s.y>canvas.height){s.y=-5;s.x=Math.random()*canvas.width;}s.brightness=0.5+Math.sin(Date.now()*0.002+s.x)*0.3;});}
function drawStars(){stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${s.brightness})`;ctx.fillRect(s.x,s.y,s.size,s.size);});}

// --- Particles ---
function spawnParticles(x,y,color,count,speed){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*speed+1;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.0,decay:Math.random()*0.03+0.02,color,size:Math.random()*4+2});}}
function spawnHealParticles(x,y){for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2;particles.push({x:x+(Math.random()-0.5)*40,y,vx:Math.cos(a)*1,vy:-Math.random()*2-1,life:1.0,decay:0.02,color:'#0f0',size:3+Math.random()*3});}}
function updateParticles(dt){particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;return p.life>0;});}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;ctx.shadowBlur=0;}

// --- Player Drawing ---
function drawPlayer(){
    const{x,y}=player;if(player.invincible>0&&Math.floor(player.invincible/4)%2===0)return;
    for(let i=0;i<player.trail.length-1;i++){const t=player.trail[i];ctx.fillStyle=`rgba(0,200,255,${i/player.trail.length*0.6})`;ctx.beginPath();ctx.arc(t.x,t.y,4+(i/player.trail.length)*8,0,Math.PI*2);ctx.fill();}
    ctx.save();ctx.translate(x,y);const ep=0.8+Math.sin(Date.now()*0.01)*0.2;ctx.shadowBlur=20;ctx.shadowColor='#0ff';
    ctx.fillStyle='#1a3a4a';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(-18,20);ctx.lineTo(0,10);ctx.lineTo(18,20);ctx.closePath();ctx.fill();
    ctx.fillStyle=`rgba(0,255,255,${ep})`;ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(-6,5);ctx.lineTo(6,5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2a4a5a';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-22,18);ctx.lineTo(-5,12);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(22,18);ctx.lineTo(5,12);ctx.closePath();ctx.fill();
    const fl=12+Math.random()*8;const g=ctx.createLinearGradient(0,15,0,15+fl);g.addColorStop(0,'#fff');g.addColorStop(0.3,'#0ff');g.addColorStop(0.7,'#06f');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-6,20);ctx.lineTo(0,20+fl);ctx.lineTo(6,20);ctx.closePath();ctx.fill();
    ctx.restore();
}

// --- Bullets ---
function shoot(){if(player.shootCooldown>0)return;const cx=player.x,cy=player.y-25;
    switch(player.weaponLevel){
        case 1:bullets.push({x:cx,y:cy,vx:0,vy:-12,w:4,h:14,color:'#0ff',damage:30});break;
        case 2:bullets.push({x:cx-8,y:cy,vx:0,vy:-12,w:4,h:14,color:'#0ff',damage:30},{x:cx+8,y:cy,vx:0,vy:-12,w:4,h:14,color:'#0ff',damage:30});break;
        case 3:bullets.push({x:cx,y:cy,vx:0,vy:-12,w:4,h:14,color:'#0f0',damage:40},{x:cx-12,y:cy+5,vx:-2,vy:-11,w:4,h:14,color:'#0ff',damage:30},{x:cx+12,y:cy+5,vx:2,vy:-11,w:4,h:14,color:'#0ff',damage:30});break;
        case 4:bullets.push({x:cx-16,y:cy+5,vx:0,vy:-14,w:3,h:20,color:'#f0f',damage:45},{x:cx-8,y:cy,vx:0,vy:-12,w:4,h:16,color:'#0ff',damage:35},{x:cx+8,y:cy,vx:0,vy:-12,w:4,h:16,color:'#0ff',damage:35},{x:cx+16,y:cy+5,vx:0,vy:-14,w:3,h:20,color:'#f0f',damage:45});break;
        case 5:for(let i=-3;i<=3;i++)bullets.push({x:cx+i*10,y:cy+Math.abs(i)*3,vx:i*1.2,vy:-11,w:4,h:16,color:'#ff0',damage:50});break;
    }
    player.shootCooldown=player.weaponLevel===5?8:5;playSFX('shoot');
}

function updateBullets(dt){bullets=bullets.filter(b=>{b.x+=b.vx;b.y+=b.vy;return b.y>-20&&b.x>-10&&b.x<canvas.width+10;});}
function drawBullets(){bullets.forEach(b=>{ctx.shadowBlur=15;ctx.shadowColor=b.color;const g=ctx.createLinearGradient(b.x,b.y-b.h/2,b.x,b.y+b.h/2);g.addColorStop(0,'#fff');g.addColorStop(0.5,b.color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(b.x-b.w/2,b.y+b.h/2);ctx.lineTo(b.x,b.y-b.h/2);ctx.lineTo(b.x+b.w/2,b.y+b.h/2);ctx.closePath();ctx.fill();});ctx.shadowBlur=0;}

// --- Spawn Logic (updated for new types) ---
function spawnEnemy(){

// --- Boss System (Day 2 — 3 variants) ---
let activeBoss = null; // track current boss for HP display

function spawnBoss(){
    const variant = wave % 9 === 0 ? 'devastator' : wave % 9 <= 4 ? 'starship' : 'shadowqueen';
    const w=canvas.width, h=canvas.height;

    if(variant==='starship'){
        // Boss-1: 星際巨艦 — 範圍砲擊
        enemies.push({
            x:w/2, y:-80, type:'boss', bossVariant:'starship', bossName:'星際巨艦',
            w:90, h:70, hp:500+wave*120, maxHp:500+wave*120, speed:1.2, color:'#ff4444', score:3000+wave*600,
            shootRate:0.06, shootTimer:0, phase:Math.random()*6.28, patternTimer:0,
            attackPattern:'spread' // 範圍擴散砲擊
        });
    } else if(variant==='shadowqueen'){
        // Boss-2: 暗影女王 — 分身+隱形
        enemies.push({
            x:w/2, y:-80, type:'boss', bossVariant:'shadowqueen', bossName:'暗影女王',
            w:70, h:65, hp:400+wave*100, maxHp:400+wave*100, speed:1.0, color:'#aa44ff', score:3500+wave*700,
            shootRate:0.04, shootTimer:0, phase:Math.random()*6.28, patternTimer:0,
            attackPattern:'clone', // 分身攻擊
            cloneCount:0, invisibleTimer:0, isHidden:false, lastCloneTime:0
        });
    } else {
        // Boss-3: 終極毀滅者 — 三階段變身
        enemies.push({
            x:w/2, y:-80, type:'boss', bossVariant:'devastator', bossName:'終極毀滅者',
            w:75, h:65, hp:600+wave*150, maxHp:600+wave*150, speed:1.3, color:'#ff8800', score:5000+wave*800,
            shootRate:0.05, shootTimer:0, phase:Math.random()*6.28, patternTimer:0,
            attackPattern:'phase1', // 三階段
            currentPhase:1, // 1=初始, 2=狂暴, 3=毀滅形態
            phaseTransitioned:false
        });
    }

    activeBoss = enemies[enemies.length-1];
}

function updateEnemies(dt){
    const ds=diffSettings[difficulty];
    enemies=enemies.filter(e=>{
        // --- BOSS LOGIC ---
        if(e.type==='boss'){
            // All bosses rise to position
            e.y+=Math.sin(Date.now()*0.001+e.phase)*0.5;
            if(e.y<80) e.y+=0.5;

            e.patternTimer+=dt;

            // Boss HP display
            const hpEl=document.getElementById('boss-hp-display');
            hpEl.textContent=`${e.bossName||'BOSS'}  HP: ${Math.ceil(e.hp)} / ${e.maxHp}`;
            hpEl.style.opacity=1;
            if(enemies.filter(x=>x.type==='boss').length===0) hpEl.style.opacity=0;

            // --- Boss-1: Starship — Spread Barrage ---
            if(e.bossVariant==='starship'){
                // Phase change at 50% HP
                const hpRatio=e.hp/e.maxHp;
                if(hpRatio<0.5 && e.attackPattern!=='spread2') e.attackPattern='spread2';

                // Spread fire pattern
                if(e.patternTimer>1.5){
                    e.patternTimer=0;
                    const count = (e.attackPattern==='spread2'?7:5);
                    const spreadAngle = 0.6;
                    for(let i=0;i<count;i++){
                        const angle=-spreadAngle/2+spreadAngle*i/(count-1);
                        bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.sin(angle)*5,vy:Math.cos(angle)*4,w:6,h:8,color:'#ff6600',damage:-20,isEnemy:true});
                    }
                }

                // Heavy beam at 30% HP
                if(hpRatio<0.3 && e.patternTimer>3){
                    e.patternTimer=0;
                    const a=Math.atan2(player.y-e.y,player.x-e.x);
                    for(let i=-1;i<=1;i++){
                        bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a+i*0.15)*7,vy:Math.sin(a+i*0.15)*7,w:8,h:10,color:'#ff0044',damage:-25,isEnemy:true});
                    }
                }
            }

            // --- Boss-2: Shadow Queen — Clone + Invisibility ---
            else if(e.bossVariant==='shadowqueen'){
                const hpRatio=e.hp/e.maxHp;
                e.invisibleTimer+=dt;

                // Invisibility cycle (every 8 seconds)
                if(!e.isHidden && e.invisibleTimer>8){
                    e.isHidden=true;
                    spawnParticles(e.x,e.y,'#aa44ff',10,3);
                } else if(e.isHidden && e.invisibleTimer>12){
                    e.isHidden=false;
                    e.invisibleTimer=0;
                    // Reveal flash
                    for(let i=0;i<8;i++){const a=Math.PI*2/8*i;spawnParticles(e.x+Math.cos(a)*35,e.y+Math.sin(a)*35,'#ff44ff',2,2);}
                }

                // Clone spawning (every 6 seconds if not invisible)
                if(!e.isHidden && e.patternTimer>6){
                    e.patternTimer=0;
                    if(e.cloneCount<3 + Math.floor(wave/5)){
                        const angle=Math.random()*Math.PI*2;
                        enemies.push({
                            x:e.x+Math.cos(angle)*80, y:e.y+Math.sin(angle)*80,
                            type:'boss', bossVariant:'shadowclone', bossName:'暗影分身',
                            w:40, h:35, hp:60, maxHp:60, speed:2.5, color:'#aa44ff', score:100,
                            shootRate:0.03, shootTimer:0, phase:Math.random()*6.28, patternTimer:0,
                            isClone:true, cloneOwner:e
                        });
                        e.cloneCount++;
                        playSFX('powerup'); // sound effect for clone spawn
                    } else {
                        // All clones despawn after 15 seconds
                        enemies=enemies.filter(x=>!(x.isClone && Date.now()-x.spawnTime>15000));
                    }
                }

                // Clone shooting at player
                if(!e.isHidden){
                    const a=Math.atan2(player.y-e.y,player.x-e.x);
                    bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*5,vy:Math.sin(a)*5,w:6,h:8,color:'#aa44ff',damage:-18,isEnemy:true});
                }

                // Teleport dash at 40% HP
                if(hpRatio<0.4 && e.patternTimer>2){
                    e.patternTimer=0;
                    e.x=Math.random()*(canvas.width-100)+50;
                    e.y=Math.random()*canvas.height*0.3+50;
                    spawnParticles(e.x,e.y,'#ff44ff',15,4);
                }
            }

            // --- Boss-3: Devastator — Three Phase Transformation ---
            else if(e.bossVariant==='devastator'){
                const hpRatio=e.hp/e.maxHp;
                let targetPhase=1;
                if(hpRatio<0.66) targetPhase=2;
                if(hpRatio<0.33) targetPhase=3;

                // Phase transition
                if(e.currentPhase!==targetPhase){
                    e.currentPhase=targetPhase;
                    const oldHp=e.hp;
                    const newMax=e.maxHp*1.5; // HP boost on transformation
                    e.hp=Math.min(oldHp, newMax);
                    e.maxHp=newMax;

                    // Visual transition effects
                    for(let i=0;i<20;i++){const a=Math.PI*2/20*i;spawnParticles(e.x+Math.cos(a)*40,e.y+Math.sin(a)*40,'#ff8800',3,5);}
                    screenShake.intensity=12;

                    if(targetPhase===2){
                        e.speed*=1.5; // Phase 2: faster
                        e.w=85; e.h=70; // Bigger
                        showPowerupNotify('⚡ Phase 2 — 狂暴模式!');
                    } else if(targetPhase===3){
                        e.speed*=1.3;
                        e.w=95; e.h=80; // Massive
                        showPowerupNotify('💀 Phase 3 — 毀滅形態!');
                    }
                }

                // Phase-specific attacks
                const hpRatioNow=e.hp/e.maxHp;

                if(e.currentPhase===1){
                    // Normal aimed shots
                    if(e.patternTimer>2){e.patternTimer=0;const a=Math.atan2(player.y-e.y,player.x-e.x);bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*5,vy:Math.sin(a)*5,w:6,h:8,color:'#ff8800',damage:-18,isEnemy:true});}
                } else if(e.currentPhase===2){
                    // Phase 2: Spiral + aimed burst every 3s
                    if(e.patternTimer>1.2){e.patternTimer=0;const spiralAngle=e.phase*0.3+Date.now()*0.002;for(let i=0;i<4;i++){const a=spiralAngle+i*Math.PI/2;bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,w:5,h:7,color:'#ffaa00',damage:-15,isEnemy:true});}}
                } else {
                    // Phase 3: Triple spread + homing attempt every 2s
                    if(e.patternTimer>2){e.patternTimer=0;const a=Math.atan2(player.y-e.y,player.x-e.x);for(let i=-2;i<=2;i++){bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a+i*0.3)*6,vy:Math.sin(a+i*0.3)*6,w:7,h:9,color:'#ff4400',damage:-22,isEnemy:true});}}
                    // Extra heavy shot every 5s in phase 3
                    if(e.patternTimer>5){e.patternTimer=0;const a=Math.atan2(player.y-e.y,player.x-e.x);bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,w:10,h:12,color:'#ff0000',damage:-35,isEnemy:true});}
                }
            }

            // --- Base boss shooting (for all variants) ---
            if(e.shootRate>0 && !e.isHidden){
                e.shootTimer+=dt;
                const effectiveShootRate=e.currentPhase===2?1.3:(e.currentPhase===3?1.5:1);
                if(e.shootTimer>1/(e.shootRate*effectiveShootRate)){
                    e.shootTimer=0;
                    // This is handled by variant-specific logic above mostly
                }
            }

            return e.y<canvas.height+80 && e.hp>0;
        }

        // --- NEW ENEMY TYPE LOGIC ---

        // Sinker: Zigzag movement (fast, low HP)
        else if(e.type==='sinker'){
            const baseSpeed=e.speed*ds.enemySpeedMul;
            e.y+=baseSpeed;
            e.x+=Math.sin(Date.now()*0.005+e.phase)*4; // Zigzag amplitude 4px per frame
            return e.y<canvas.height+60 && e.hp>0;
        }

        // Tank: Slow, high HP, shoots occasionally
        else if(e.type==='tank'){
            e.y+=e.speed*ds.enemySpeedMul;
            if(e.shootRate>0){
                e.shootTimer+=dt;
                if(e.shootTimer>1/e.shootRate&&Math.random()<0.4){
                    e.shootTimer=0;
                    const a=Math.atan2(player.y-e.y,player.x-e.x);
                    bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,w:7,h:10,color:'#aaaaff',damage:-12,isEnemy:true});
                }
            }
            return e.y<canvas.height+60 && e.hp>0;
        }

        // Healer: Slow, restores nearby allies' HP
        else if(e.type==='healer'){
            e.y+=e.speed*ds.enemySpeedMul;
            // Heal nearby enemies every 2 seconds
            e.healTimer=(e.healTimer||0)+dt;
            if(e.healTimer>120){ // ~2 seconds at 60fps
                e.healTimer=0;
                let healedCount=0;
                for(const ally of enemies){
                    if(ally===e||ally.type==='boss')continue;
                    const dx=ally.x-e.x,dy=ally.y-e.y;
                    if(dx*dx+dy*dy<80*80 && ally.hp<ally.maxHp){ // 80px radius
                        ally.hp=Math.min(ally.maxHp,ally.hp+15);
                        spawnHealParticles(ally.x,ally.y-20);
                        healedCount++;
                    }
                }
                if(healedCount>0) playSFX('heal');
            }
            return e.y<canvas.height+60 && e.hp>0;
        }

        // Sniper: Medium speed, highly accurate long-range shots
        else if(e.type==='sniper'){
            const baseSpeed=e.speed*ds.enemySpeedMul;
            e.y+=baseSpeed*0.7; // Slightly slower descent
            // Strafe toward player horizontally
            if(player.x>e.x) e.x+=1.5;
            else e.x-=1.5;

            // Very accurate shots (3x per second when close enough)
            if(e.y>200 && e.shootRate>0){ // Only shoots when in range
                e.shootTimer+=dt;
                const rate=e.shootRate*2; // Faster fire rate at range
                if(e.shootTimer>1/rate&&Math.random()<0.5){
                    e.shootTimer=0;
                    const a=Math.atan2(player.y-e.y,player.x-e.x);
                    bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*7,vy:Math.sin(a)*7,w:4,h:6,color:'#ff66ff',damage:-10,isEnemy:true}); // Low damage but very accurate and fast
                }
            }
            return e.y<canvas.height+60 && e.hp>0;
        }

        // --- Original enemy logic ---
        else {
            e.y+=e.speed*ds.enemySpeedMul;
            if(e.type==='fighter') e.x+=Math.sin(Date.now()*0.003+e.y*0.1)*2;
            if(e.shootRate>0){
                e.shootTimer+=dt;
                if(e.shootTimer>1/e.shootRate&&Math.random()<0.3){
                    e.shootTimer=0;
                    const a=Math.atan2(player.y-e.y,player.x-e.x);
                    bullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*4,vy:Math.sin(a)*4,w:5,h:8,color:'#f0f',damage:-15,isEnemy:true});
                }
            }
            return e.y<canvas.height+60 && e.hp>0;
        }
    });

    // Clean up dead clones after their time
    enemies=enemies.filter(e=>!(e.isClone&&Date.now()-(e.spawnTime||Date.now())>15000));
}

// --- Draw Enemies (updated for new types) ---
function drawEnemies(){
    enemies.forEach(e=>{
        ctx.save();
        ctx.translate(e.x,e.y);

        // Boss drawing
        if(e.type==='boss' && e.bossVariant){
            const isVisible=!e.isHidden;
            const alpha=e.isHidden?0.2:1;
            ctx.globalAlpha=alpha;

            if(e.bossVariant==='starship'){
                ctx.shadowBlur=25;ctx.shadowColor='#ff4444';
                // Ship body
                const g=ctx.createRadialGradient(0,0,10,0,0,45);
                g.addColorStop(0,'#fff');g.addColorStop(0.3,'#f44');g.addColorStop(1,'#600');
                ctx.fillStyle=g;
                ctx.beginPath();ctx.moveTo(-40,-20);ctx.lineTo(-20,-35);ctx.lineTo(20,-35);ctx.lineTo(40,-20);
                ctx.lineTo(50,0);ctx.lineTo(40,20);ctx.lineTo(-40,20);ctx.closePath();ctx.fill();
                // Wings
                ctx.fillStyle='#a00';
                ctx.beginPath();ctx.moveTo(-30,-10);ctx.lineTo(-55,-25);ctx.lineTo(-50,10);ctx.closePath();ctx.fill();
                ctx.beginPath();ctx.moveTo(30,-10);ctx.lineTo(55,-25);ctx.lineTo(50,10);ctx.closePath();ctx.fill();
            } else if(e.bossVariant==='shadowqueen'){
                ctx.shadowBlur=20;ctx.shadowColor='#aa44ff';
                const g=ctx.createRadialGradient(0,0,5,0,0,35);
                g.addColorStop(0,e.isHidden?'rgba(170,68,255,0.3)':'#fff');g.addColorStop(0.4,'#aa44ff');g.addColorStop(1,'transparent');
                ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<6;i++){const a=(Math.PI/3)*i-Math.PI/2,r=e.w/2;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
                ctx.closePath();ctx.fill();
                // Crown effect
                if(!e.isHidden){ctx.fillStyle='#ff44ff';for(let i=0;i<5;i++){const a=Math.PI*2/5*i;ctx.beginPath();ctx.arc(Math.cos(a)*15,-25+Math.sin(a)*5,3,0,6.28);ctx.fill();}}
            } else if(e.bossVariant==='devastator'){
                ctx.shadowBlur=30;ctx.shadowColor='#ff8800';
                const color=e.currentPhase===1?'#ffaa44':(e.currentPhase===2?'#ff6600':'#ff2200');
                const g=ctx.createRadialGradient(0,0,5,0,0,e.w/2);
                g.addColorStop(0,'#fff');g.addColorStop(0.3,color);g.addColorStop(1,'#400');
                ctx.fillStyle=g;
                ctx.beginPath();ctx.moveTo(-e.w/2,-e.h/3);ctx.lineTo(-e.w/3,-e.h/2);ctx.lineTo(e.w/3,-e.h/2);ctx.lineTo(e.w/2,-e.h/3);
                ctx.lineTo(e.w/2,e.h/3);ctx.lineTo(e.w/3,e.h/2);ctx.lineTo(-e.w/3,e.h/2);ctx.lineTo(-e.w/2,e.h/3);ctx.closePath();ctx.fill();
                // Phase indicator
                if(e.currentPhase>=2){ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(0,-5,6+Math.sin(Date.now()*0.01)*2,0,6.28);ctx.fill();}
            }

            ctx.globalAlpha=1;

            // Boss HP bar
            if(!e.isClone){
                const hpRatio=e.hp/e.maxHp;
                ctx.fillStyle='#300';ctx.fillRect(-45,-e.h/2-18,90,6);
                ctx.fillStyle=hpRatio>0.5?'#f00':(hpRatio>0.25?'#ff0':'#f0f');ctx.fillRect(-45,-e.h/2-18,90*hpRatio,6);
            }

        // Clone drawing (smaller shadow queen clones)
        } else if(e.isClone){
            ctx.globalAlpha=0.6;
            ctx.shadowBlur=10;ctx.shadowColor='#aa44ff';
            const g=ctx.createRadialGradient(0,0,3,0,0,20);
            g.addColorStop(0,'#fff');g.addColorStop(0.5,'#8833cc');g.addColorStop(1,'transparent');
            ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<6;i++){const a=(Math.PI/3)*i-Math.PI/2,r=20;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
            ctx.closePath();ctx.fill();
            ctx.globalAlpha=1;

        // New enemy types drawing
        } else if(e.type==='sinker'){
            ctx.shadowBlur=12;ctx.shadowColor='#88ff88';
            ctx.fillStyle='#88ff88';
            ctx.beginPath();ctx.moveTo(0,-e.h/2);ctx.lineTo(e.w/2,5);ctx.lineTo(0,e.h/2);ctx.lineTo(-e.w/2,5);ctx.closePath();ctx.fill();
            // Speed lines
            for(let i=0;i<3;i++){const lx=-8+i*8;ctx.strokeStyle='rgba(136,255,136,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lx,-e.h/2-5-i*3);ctx.lineTo(lx,e.h/2+5+i*3);ctx.stroke();}
        } else if(e.type==='tank'){
            ctx.shadowBlur=15;ctx.shadowColor='#aaaaff';
            const g=ctx.createRadialGradient(0,0,5,0,0,e.w/2);
            g.addColorStop(0,'#fff');g.addColorStop(0.4,'#88aaff');g.addColorStop(1,'#3355aa');
            ctx.fillStyle=g;ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);
            // Treads
            ctx.fillStyle='#556';ctx.fillRect(-e.w/2-4,-e.h/2+5,6,e.h-10);ctx.fillRect(e.w/2-2,-e.h/2+5,6,e.h-10);
        } else if(e.type==='healer'){
            ctx.shadowBlur=15;ctx.shadowColor='#00ff88';
            // Pulsing glow
            const pulse=Math.sin(Date.now()*0.004)*0.3+0.7;
            ctx.fillStyle=`rgba(0,255,136,${pulse})`;ctx.beginPath();ctx.arc(0,-e.h/2-8,6,0,6.28);ctx.fill();
            // Body — cross shape
            ctx.fillStyle='#00cc66';
            ctx.fillRect(-4,-e.h/2,8,e.h);ctx.fillRect(-e.w/2,-4,e.w,8);
            // Glow radius indicator (subtle)
            ctx.strokeStyle=`rgba(0,255,136,${pulse*0.2})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,80,0,6.28);ctx.stroke();
        } else if(e.type==='sniper'){
            ctx.shadowBlur=12;ctx.shadowColor='#ff66ff';
            const g=ctx.createRadialGradient(0,0,3,0,0,e.w/2);
            g.addColorStop(0,'#fff');g.addColorStop(0.5,'#ff66ff');g.addColorStop(1,'#aa00aa');
            ctx.fillStyle=g;
            ctx.beginPath();ctx.moveTo(0,-e.h/2);ctx.lineTo(e.w/2,e.h/4);ctx.lineTo(0,e.h/2);ctx.lineTo(-e.w/2,e.h/4);ctx.closePath();ctx.fill();
            // Scope indicator
            const scopeAlpha=Math.sin(Date.now()*0.008)*0.3+0.5;
            ctx.strokeStyle=`rgba(255,102,255,${scopeAlpha})`;ctx.lineWidth=1;
            ctx.beginPath();ctx.arc(0,0,e.w/2+5,0,6.28);ctx.stroke();
        } else {
            // Original enemies (drone/fighter/bomber)
            const glow=e.type==='bomber'?'#f0a':(e.type==='fighter'?'#fa0':'#f44');
            ctx.shadowBlur=15;ctx.shadowColor=glow;ctx.fillStyle=e.color;
            ctx.beginPath();
            if(e.type==='drone'){ctx.moveTo(0,-e.h/2);ctx.lineTo(e.w/2,0);ctx.lineTo(0,e.h/2);ctx.lineTo(-e.w/2,0);}
            else if(e.type==='fighter'){ctx.moveTo(0,-e.h/2);ctx.lineTo(e.w/2,e.h/3);ctx.lineTo(e.w/4,e.h/2);ctx.lineTo(-e.w/4,e.h/2);ctx.lineTo(-e.w/2,e.h/3);}
            else{ctx.arc(0,0,e.w/2,0,6.28);}
            ctx.closePath();ctx.fill();
        }

        // HP bar for non-boss enemies with low HP
        if(e.type!=='boss' && e.hp<e.maxHp){
            const hpRatio=e.hp/e.maxHp;
            ctx.fillStyle='#300';ctx.fillRect(-15,-e.h/2-8,30,3);
            ctx.fillStyle=hpRatio>0.5?'#0f0':(hpRatio>0.25?'#ff0':'#f00');ctx.fillRect(-15,-e.h/2-8,30*hpRatio,3);
        }

        ctx.restore();
    });
}

// --- Meteors ---
function spawnMeteor(){const sz=Math.random()*30+15;meteors.push({x:Math.random()*canvas.width,y:-sz,vx:(Math.random()-0.5)*2,vy:Math.random()*2+1.5,size:sz,rotation:Math.random()*6.28,rotSpeed:(Math.random()-0.5)*0.05,hp:sz>25?3:1,vertices:genMeteor(sz)});}
function genMeteor(r){const v=[];for(let i=0;i<8;i++){const a=(6.28/8)*i;v.push({x:Math.cos(a)*r*(0.7+Math.random()*0.3),y:Math.sin(a)*r*(0.7+Math.random()*0.3)});}return v;}
function updateMeteors(dt){meteors=meteors.filter(m=>{m.x+=m.vx;m.y+=m.vy;m.rotation+=m.rotSpeed;return m.y<canvas.height+60&&m.x>-50&&m.x<canvas.width+50;});}
function drawMeteors(){meteors.forEach(m=>{ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rotation);ctx.shadowBlur=20;ctx.shadowColor='#f80';const g=ctx.createRadialGradient(0,0,5,0,0,m.size);g.addColorStop(0,'#fff');g.addColorStop(0.4,'#fa0');g.addColorStop(1,'#630');ctx.fillStyle=g;ctx.beginPath();m.vertices.forEach((v,i)=>{if(i===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);});ctx.closePath();ctx.fill();if(Math.random()<0.3)spawnParticles(m.x+(Math.random()-0.5)*m.size,m.y-m.size/2,'#f80',1,1);ctx.restore();});}

// --- Power-ups ---
function spawnPowerup(x,y){if(Math.random()>0.3)return;const types=['weapon','health','score'];powerups.push({x,y,type:types[Math.floor(Math.random()*3)],vy:1.5,size:12,pulse:0});}
function updatePowerups(dt){powerups=powerups.filter(p=>{p.y+=p.vy;p.pulse+=0.1;return p.y<canvas.height+30;});}
function drawPowerups(){powerups.forEach(p=>{const gl=Math.sin(p.pulse)*0.3+0.7;ctx.save();ctx.translate(p.x,p.y);
    if(p.type==='weapon'){ctx.shadowBlur=20;ctx.shadowColor='#ff0';ctx.fillStyle=`rgba(255,255,0,${gl})`;for(let i=0;i<5;i++){const a=(6.28/5)*i-1.57;ctx.beginPath();ctx.arc(Math.cos(a)*p.size,Math.sin(a)*p.size,4,0,6.28);ctx.fill();}ctx.fillStyle='#fff';ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('\u26A1',0,5);}
    else if(p.type==='health'){ctx.shadowBlur=20;ctx.shadowColor='#f00';ctx.fillStyle=`rgba(255,0,0,${gl})`;ctx.beginPath();ctx.arc(-5,-3,p.size*0.6,0,6.28);ctx.arc(5,-3,p.size*0.6,0,6.28);ctx.fill();ctx.fillRect(-p.size*0.4,-p.size*0.1,p.size*0.8,p.size*0.7);}
    else{ctx.shadowBlur=20;ctx.shadowColor='#f0f';ctx.fillStyle=`rgba(255,0,255,${gl})`;ctx.beginPath();for(let i=0;i<6;i++){const a=(Math.PI/3)*i-0.524;if(i===0)ctx.moveTo(Math.cos(a)*p.size,Math.sin(a)*p.size);else ctx.lineTo(Math.cos(a)*p.size,Math.sin(a)*p.size);}ctx.closePath();ctx.fill();}
    ctx.restore();});}

// --- Collision Detection (updated for new enemy types) ---
function checkCollisions(){
    // Player bullets vs enemies
    for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i]; if(b.isEnemy)continue;
        for(let j=enemies.length-1;j>=0;j--){
            const e=enemies[j];
            const ox=Math.min(b.x+b.w/2,e.x+e.w/2)-Math.max(b.x-b.w/2,e.x-e.w/2);
            const oy=Math.min(b.y+b.h/2,e.y+e.h/2)-Math.max(b.y-b.h/2,e.y-e.h/2);
            if(ox>0&&oy>0){
                e.hp-=b.damage;
                bullets.splice(i,1);
                spawnParticles(b.x,b.y,'#fff',3,3);playSFX('hit');
                if(e.hp<=0){
                    score+=e.score||100;combo++;comboTimer=2;enemiesKilledInWave++;
                    spawnParticles(e.x,e.y,e.color,15,5);screenShake.intensity=e.type==='boss'?10:4;playSFX('explosion');
                    if(!e.isClone && e.type!=='boss'){spawnPowerup(e.x,e.y);}
                    else if(e.type==='boss'&&!e.isClone){for(let k=0;k<3;k++)spawnPowerup(e.x+(k-1)*20,e.y);}
                }
                break;
            }
        }
    }

    // Enemy bullets vs player
    for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];if(!b.isEnemy)continue;
        if(Math.abs(b.x-player.x)<(player.w/2+b.w/2)&&Math.abs(b.y-player.y)<(player.h/2+b.h/2)){
            player.hp-=Math.abs(b.damage);bullets.splice(i,1);screenShake.intensity=5;spawnParticles(player.x,player.y,'#0ff',8,4);if(player.invincible<=0)combo=0;
        }
    }

    // Enemies vs player collision
    enemies.forEach(e=>{
        if(Math.abs(e.x-player.x)<(e.w/2+player.w/2)&&Math.abs(e.y-player.y)<(e.h/2+player.h/2)){
            player.hp-=30;screenShake.intensity=8;spawnParticles(player.x,player.y,'#f00',12,5);
            if(!e.isClone && e.type!=='boss')e.hp=0;else if(e.type==='boss'&&!e.isClone)e.y+=30;
        }
    });

    // Meteors vs player
    meteors.forEach(m=>{
        if(Math.abs(m.x-player.x)<(m.size+player.w/2)&&Math.abs(m.y-player.y)<(m.size+player.h/2)){
            player.hp-=20;screenShake.intensity=6;spawnParticles(player.x,player.y,'#f80',10,4);combo=0;
        }
    });

    // Powerups vs player
    for(let i=powerups.length-1;i>=0;i--){
        const p=powerups[i];
        if(Math.abs(p.x-player.x)<(p.size+player.w/2)&&Math.abs(p.y-player.y)<(p.size+player.h/2)){
            if(p.type==='weapon'){player.weaponLevel=Math.min(5,player.weaponLevel+1);showPowerupNotify('武器升級! Lv.'+player.weaponLevel);}
            else if(p.type==='health'){player.hp=Math.min(player.maxHp,player.hp+25);showPowerupNotify('+25 HP');}
            else{const bonus=100*(wave+combo);score+=bonus;showPowerupNotify('+'+bonus+' PTS');}
            playSFX('powerup');spawnParticles(p.x,p.y,'#fff',8,3);powerups.splice(i,1);
        }
    }

}

function showPowerupNotify(t){const el=document.getElementById('powerup-notify');el.textContent=t;el.style.opacity=1;setTimeout(()=>{el.style.opacity=0;},2000);}

// --- Wave System (updated for new enemies and boss variants) ---
let enemiesKilledInWave=0, waveTransitionTimer=0;
const maxEnemiesPerWave=[8,12,16,20,30];

function updateWaves(dt){
    if(waveTransitionTimer>0){waveTransitionTimer-=dt;return;}
    const ds=diffSettings[difficulty];
    const maxE=Math.min(maxEnemiesPerWave[Math.min(wave-1,maxEnemiesPerWave.length-1)],45);

    // Spawn enemies (scaled by difficulty, weighted toward new types at higher waves)
    if(enemies.filter(e=>e.type!=='boss').length<maxE&&Math.random()<0.02*ds.spawnRate+wave*0.006){spawnEnemy();}

    // Spawn meteors
    if(Math.random()<(0.01+wave*0.003)*ds.meteorFreq){spawnMeteor();}

    // Check wave completion — Boss every 3 waves
    const remaining = enemies.filter(e=>e.type!=='boss').length;
    if(enemiesKilledInWave>=maxE&&remaining===0){
        waveTransitionTimer=2;enemiesKilledInWave=0;wave++;
        // Boss appears every 3 waves (starting from wave 3)
        if(wave%3===0 && wave>=3){
            document.getElementById('boss-warning').style.opacity=1;
            if(bossWarningTimeout)clearTimeout(bossWarningTimeout);
            bossWarningTimeout=setTimeout(()=>{
                document.getElementById('boss-warning').style.opacity=0;
                playSFX('boss');
                spawnBoss();
            },2500);
        } else {
            showPowerupNotify(`Wave ${wave-1} Complete!`);
            player.hp=Math.min(player.maxHp,player.hp+ds.waveHeal);
        }
    }
}

// --- Screen Shake ---
function updateScreenShake(){if(screenShake.intensity>0){screenShake.x=(Math.random()-0.5)*screenShake.intensity;screenShake.y=(Math.random()-0.5)*screenShake.intensity;screenShake.intensity*=0.9;if(screenShake.intensity<0.5)screenShake.intensity=0;}else{screenShake.x=0;screenShake.y=0;}}

// --- Game Loop ---
function gameLoop(timestamp){
    if(gameState!=='playing')return;const dt=Math.min((timestamp-lastTime)/16.67,3);lastTime=timestamp;
    updateStars(dt);updateBullets(dt);updateEnemies(dt);updateMeteors(dt);updatePowerups(dt);updateParticles(dt);updateScreenShake();
    if(waveTransitionTimer<=0)updateWaves(dt);
    if(combo>1)comboTimer-=dt/60;if(comboTimer<=0)combo=0;

    const ml=keys['KeyA']||keys['ArrowLeft']||mobileLeft,mr=keys['KeyD']||keys['ArrowRight']||mobileRight;
    player.x+=(mr?1:0)*player.speed-(ml?1:0)*player.speed;player.x=Math.max(player.w/2,Math.min(canvas.width-player.w/2,player.x));
// Allow vertical movement within safe zone (HUD area at top)
const minY = Math.max(canvas.height * 0.15, 70);
const maxY = canvas.height - 120;
player.y += (mr ? 1 : 0) * player.speed * 0.6 - (ml ? 1 : 0) * player.speed * 0.6;
player.y = Math.max(minY, Math.min(maxY, player.y));

    if(keys['Space']||mobileFireing)shoot();
    if(player.shootCooldown>0)player.shootCooldown-=dt;if(player.invincible>0)player.invincible-=dt;

    player.trail.push({x:player.x,y:player.y+25});if(player.trail.length>8)player.trail.shift();

    ctx.save();ctx.translate(screenShake.x,screenShake.y);
    const bg=ctx.createLinearGradient(0,0,0,canvas.height);bg.addColorStop(0,'#0a0015');bg.addColorStop(0.5,'#0d0020');bg.addColorStop(1,'#150030');ctx.fillStyle=bg;ctx.fillRect(-10,-10,canvas.width+20,canvas.height+20);
    drawStars();drawMeteors();drawPowerups();drawBullets();drawEnemies();drawPlayer();drawParticles();
    const vig=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.height*0.3,canvas.width/2,canvas.height/2,canvas.height*0.8);vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,0.4)');ctx.fillStyle=vig;ctx.fillRect(-10,-10,canvas.width+20,canvas.height+20);
    ctx.restore();

    document.getElementById('score-display').textContent=score.toLocaleString();document.getElementById('wave-display').textContent=wave;document.getElementById('health-bar').style.width=(player.hp/player.maxHp*100)+'%';
    const ce=document.getElementById('combo-display');if(combo>1&&comboTimer>0){ce.textContent='\uD83D\uDD25 '+combo+'x COMBO';ce.style.opacity=1;}else{ce.style.opacity=0;}

    if(player.hp<=0){gameOver();return;}
    animFrame=requestAnimationFrame(gameLoop);
}

// --- Game State Functions ---
function startGame(){
    initAudio();
    gameState='playing';score=0;wave=1;combo=0;comboTimer=0;
    const ds=diffSettings[difficulty];
    player.x=canvas.width/2;player.y=canvas.height-80;
    player.hp=ds.playerHp;player.maxHp=ds.playerHp;
    player.weaponLevel=1;player.invincible=2;
    bullets=[];enemies=[];particles=[];powerups=[];meteors=[];screenShake.intensity=0;
    enemiesKilledInWave=0;waveTransitionTimer=0;activeBoss=null;
    document.getElementById('start-screen').style.display='none';
    document.getElementById('gameover-screen').style.display='none';
    initStars();lastTime=performance.now();animFrame=requestAnimationFrame(gameLoop);
}

function pauseGame(){gameState='paused';if(animFrame)cancelAnimationFrame(animFrame);}
function resumeGame(){gameState='playing';lastTime=performance.now();animFrame=requestAnimationFrame(gameLoop);}
function togglePause(){if(gameState==='playing')pauseGame();else if(gameState==='paused')resumeGame();}

function gameOver(){
    gameState='gameover';if(animFrame)cancelAnimationFrame(animFrame);
    document.getElementById('final-score').textContent='最終得分: '+score.toLocaleString()+' | Wave: '+wave;
    document.getElementById('gameover-screen').style.display='flex';
}
function restartGame(){startGame();}

// --- Init ---
initStars();
(function drawMenuBg(){if(gameState!=='menu')return;const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#0a0015');g.addColorStop(1,'#150030');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);updateStars(1);drawStars();requestAnimationFrame(drawMenuBg);})();
</script>
